<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crep Developer Production</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 90%;
            margin-top: 15vh;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }
        p.subtitle {
            color: #888888;
            margin-bottom: 3rem;
            font-size: 1rem;
        }
        .app-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .app-card {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
            text-align: left;
            text-decoration: none;
            color: inherit;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease-in-out;
        }
        .app-card:hover {
            transform: translateY(-3px);
            border-color: #555555;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .app-info {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .app-title {
            font-size: 1.1rem;
            font-weight: 500;
            margin: 0;
        }
        .app-desc {
            color: #aaaaaa;
            margin: 0;
            font-size: 0.9rem;
        }
        .play-btn {
            background-color: #ffffff;
            color: #000000;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .app-card:hover .play-btn {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Crep Developer Production</h1>
    <p class="subtitle">My applications on Google Play</p>

    <div class="app-list">
        <!-- Ваше первое приложение -->
        <a href="https://play.google.com/store/apps/details?id=com.crep.hvylynamovchannya" class="app-card" target="_blank">
            <div class="app-info">
                <h2 class="app-title">Хвилина Мовчання</h2>
                <p class="app-desc">National minute of silence</p>
            </div>
            <div class="play-btn">GET</div>
        </a>

        <!-- Ваше второе приложение: CleanSlate -->
        <a href="https://play.google.com/store/apps/details?id=com.crep.cleanslate" class="app-card" target="_blank">
            <div class="app-info">
                <h2 class="app-title">CleanSlate</h2>
                <p class="app-desc">Fast and lightweight storage cleaning utility</p>
            </div>
            <div class="play-btn">GET</div>
        </a>
    </div>
</div>

</body>
</html>
